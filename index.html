<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cap Stone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
  <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"> </script> -->
  </head>
  <body>
    <h1 id="mainTitle">OpenVerse</h1>
    <main class="container mt-4">
      <section id="recordings-carousel" class="mb-5">
        <h2 class="text-center mb-4">Recent Recordings</h2>
        <div id="recordingsCarousel" class="carousel slide" data-bs-ride="false">
          <div class="carousel-inner" id="carouselInner">
            <!-- Carousel items will be dynamically inserted here -->
            <div class="carousel-item active">
              <div class="d-flex flex-column align-items-center justify-content-center p-5 bg-light rounded">
                <h3 class="text-muted">No recordings yet</h3>
                <p>Visit the <a href="recorder.html">Recorder</a> page to create your first recording!</p>
              </div>
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#recordingsCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#recordingsCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
          <div class="carousel-indicators" id="carouselIndicators">
            <!-- Indicators will be dynamically inserted here -->
          </div>
        </div>
      </section>
    </main>
  </body>
  <!-- CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="" crossorigin="anonymous"></script>
    <!-- Local -->
    <script src="script.js"></script>
</html>
