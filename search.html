<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search - OpenVerse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <h1 id="mainTitle">OpenVerse - Search Poems</h1>
    <main class="container mt-4">
        <section id="search-section" class="mb-5">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Search Poetry</h2>
                    
                    <!-- Search Type Selector -->
                    <div class="mb-3">
                        <label for="searchType" class="form-label"><strong>Search By:</strong></label>
                        <select id="searchType" class="form-select">
                            <option value="author">Author</option>
                            <option value="title">Title</option>
                            <option value="lines">Line Content</option>
                            <option value="linecount">Number of Lines</option>
                            <option value="random">Random Poems</option>
                        </select>
                    </div>

                    <!-- Search Input -->
                    <div class="mb-3" id="searchInputGroup">
                        <label for="searchInput" class="form-label"><strong>Search Term:</strong></label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Enter author name...">
                    </div>

                    <!-- Exact Match Checkbox -->
                    <div class="mb-3 form-check" id="exactMatchGroup">
                        <input type="checkbox" class="form-check-input" id="exactMatch">
                        <label class="form-check-label" for="exactMatch">Exact match only</label>
                    </div>

                    <!-- Output Fields -->
                    <div class="mb-3">
                        <label class="form-label"><strong>Show Fields:</strong></label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="author" id="fieldAuthor" checked>
                            <label class="form-check-label" for="fieldAuthor">Author</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="title" id="fieldTitle" checked>
                            <label class="form-check-label" for="fieldTitle">Title</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="lines" id="fieldLines">
                            <label class="form-check-label" for="fieldLines">Lines (full text)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="linecount" id="fieldLinecount" checked>
                            <label class="form-check-label" for="fieldLinecount">Line Count</label>
                        </div>
                    </div>

                    <!-- Search Button -->
                    <button id="searchBtn" class="btn btn-primary btn-lg w-100">Search</button>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section id="results-section" class="mb-5" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Search Results</h2>
                <span id="resultCount" class="badge bg-secondary">0 results</span>
            </div>
            <div id="resultsContainer"></div>
        </section>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center my-5" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Searching poetry database...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
    
</body>
</html>
